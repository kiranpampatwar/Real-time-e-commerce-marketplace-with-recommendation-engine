<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Login</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center">
  <form method="post" class="bg-white shadow rounded-xl p-8 w-full max-w-md">
    {% csrf_token %}
    <h1 class="text-2xl font-bold mb-6">Marketplace Login</h1>
    {{ form.as_p }}
    <button class="mt-4 bg-slate-900 text-white px-5 py-2 rounded-lg">Login</button>
  </form>
</body>
</html>
